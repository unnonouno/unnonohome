# Prefix and key bindings
# Use C-t as the tmux prefix instead of the default C-b.
set -g prefix C-t
unbind C-b

# Reload this file without restarting tmux.
bind C-r source-file ~/.tmux.conf \; display "Reloaded"

# Move between windows with prefix + C-n / C-p.
bind C-n next-window
bind C-p previous-window

# Shell and terminal
# Start new panes and windows with zsh.
set-option -g default-shell /bin/zsh

# Make Escape feel responsive in vi/vim. Increase this if Alt-key input is unstable.
set -s escape-time 0

# Use tmux terminfo with RGB color support for modern terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'

# Interaction and scrollback
# Allow mouse selection, pane resizing, and window switching.
set -g mouse on

# Keep more scrollback than the tmux default.
set -g history-limit 50000

# Copy mode
# Use vi-style keys in copy mode.
setw -g mode-keys vi

# Colors (Solarized dark inspired)
# Reference: https://github.com/altercation/solarized/blob/master/tmux/tmuxcolors-dark.conf

# Status bar colors. Use an explicit background so it does not blend into the terminal.
set-option -g status-style fg=yellow,bg=black

# Window list colors.
set-window-option -g window-status-style fg=brightblue,bg=black,dim
set-window-option -g window-status-current-style fg=brightred,bg=black,bold

# Pane borders.
set-option -g pane-border-style fg=black
set-option -g pane-active-border-style fg=brightgreen

# Command prompt and tmux messages.
set-option -g message-style bg=black,fg=brightred

# Pane number overlay shown by display-panes.
set-option -g display-panes-active-colour blue
set-option -g display-panes-colour brightred

# Window names
# Rename windows automatically. If the window name is zsh, show the current directory name.
set -g automatic-rename on
set -g window-status-format         '#I:#{?#{==:#W,zsh},#{b:pane_current_path},#W}#F'
set -g window-status-current-format '#I:#{?#{==:#W,zsh},#{b:pane_current_path},#W}#F'

# macOS integration
# Use reattach-to-user-namespace only when it exists; Linux and modern macOS setups skip this.
if-shell 'test "$(uname)" = Darwin && command -v reattach-to-user-namespace >/dev/null' 'set -g default-command "reattach-to-user-namespace -l /bin/zsh"'
